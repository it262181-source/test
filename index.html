```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        /* ページ全体 */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            line-height: 1.6;
            padding-bottom: 150px;
        }

        /* ヘッダー */
        header {
            background-color: #440000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        /* メインコンテンツ */
        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            color: #cc0000;
        }

        section {
            background-color: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        section h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        /* フッターを画面下部に固定 */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            background-color: #440000;
            color: white;
            text-align: center;
            padding: 10px 15px;
            font-size: 14px;
        }

        footer p {
            margin: 4px 0;
        }

        /* SNSリンク */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 5px 0;
        }

        .social-links a {
            color: #74c0fc;
            text-decoration: none;
        }

        .social-links a:hover {
            text-decoration: underline;
        }

        /* コピーライト */
        .copyright {
            font-size: 12px;
            color: #ddd;
        }

        /* スマートフォン対応 */
        @media (max-width: 480px) {
            main {
                padding: 0 12px;
            }

            .social-links {
                gap: 12px;
            }

            footer {
                font-size: 12px;
            }

            body {
                padding-bottom: 130px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>トライデントコンピュータ専門学校</h1>
    </header>

    <main>
        <section>
            <h2>このサイトについて</h2>
            <p>
                このWebサイトは、トライデントコンピュータ専門学校についてのサイトです。
            </p>
        </section>

        <section>
            <h2>お知らせ</h2>
            <p>
                このサイトでは、日々の活動や新しい情報を
                発信していきます。ぜひご覧ください。
            </p>
        </section>
    </main>

    <footer>
        <p>お問い合わせ：info@example.com</p>

        <div class="social-links">
            <a href="https://www.instagram.com/"
               target="_blank" rel="noopener noreferrer">Instagram</a>

            <a href="https://x.com/"
               target="_blank" rel="noopener noreferrer">X</a>

            <a href="https://www.facebook.com/"
               target="_blank" rel="noopener noreferrer">Facebook</a>
        </div>

        <p class="copyright">
            &copy; 2026 My Website
        </p>
    </footer>

</body>
</html>
